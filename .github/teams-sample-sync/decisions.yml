version: 1
decisions:
- id: DEC-001
  sample: agent-targeted-messages
  status: superseded
  question: Should the Agents SDK sample add the upstream 'sync test' message response
    in its agents-owned handler?
  recommendation: Approve only if this response is intended product behavior, not
    an upstream synchronization fixture.
  evidence: Upstream commit 6745b52eee822a466551f6a955245aa501789146 adds `text.Contains("sync
    test")` before the fallback response.
  impact: Approval permits a behavior change in AgentTargetedMessagesAgent.cs; rejection
    preserves current fallback behavior.
  invalidatesOn: The upstream change is removed or replaced with documented product
    behavior.
  supersededReason: Local simulation only. No durable human decision or pull request exists.
