name: Finalize Teams sync PR

on:
  pull_request_target:
    types: [opened, synchronize, edited, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      finalize_pr_number:
        description: 'Recovery only: enter an existing PR number (e.g. 58) to retry finalization. Automatic finalization does not use this input.'
        required: true
        type: string
        default: ""

env:
  SYNC_TOOL: automation/teams-sample-sync

jobs:
  finalize-publication:
    name: Finalize prepared Teams sync PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: write
      checks: write
    concurrency:
      group: teams-sample-sync-publication-${{ github.event.pull_request.number || inputs.finalize_pr_number }}
      cancel-in-progress: false
      queue: max
    steps:
      # Execute trusted default-branch tooling, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: automation/teams-sample-sync/package-lock.json
      - run: npm ci --prefix "$SYNC_TOOL" && npm run build --prefix "$SYNC_TOOL"
      - name: Wait for Copilot, verify publication, and mark PR ready
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_MODE: finalize
        run: node "$SYNC_TOOL/dist/check-publication.js"
