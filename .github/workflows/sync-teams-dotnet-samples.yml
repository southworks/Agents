name: Sync Teams .NET samples

on:
  workflow_dispatch:
    inputs:
      sample:
        description: Selected sample or all
        required: true
        default: all
      createPr:
        description: Create draft pull requests
        type: boolean
        default: false
      maxAgentAttempts:
        description: Maximum Copilot attempts (1-5)
        default: "5"

env:
  SYNC_TOOL: agent-plugins/agents-for-net/skills/sync-teams-dotnet-samples-to-agents-sdk/scripts

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      baseSha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: OfficeDev/Microsoft-Teams-Samples
          ref: main
          path: .sync/upstream
          persist-credentials: false
      - uses: ./.github/actions/setup-teams-sample-sync
      - id: plan
        shell: bash
        env:
          SYNC_SAMPLE: ${{ inputs.sample }}
        run: |
          sample_arg=()
          [ "$SYNC_SAMPLE" = all ] || sample_arg=(--sample "$SYNC_SAMPLE")
          node "$SYNC_TOOL/dist/cli.js" plan --repo-root . --upstream-root .sync/upstream "${sample_arg[@]}" --output .sync/plan.json
          echo "matrix=$(jq -c .matrix .sync/plan.json)" >> "$GITHUB_OUTPUT"
          jq . .sync/plan.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with: { name: teams-sample-sync-plan, path: .sync/plan.json }

  migrate:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: teams-sample-sync-${{ matrix.sample }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.baseSha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: OfficeDev/Microsoft-Teams-Samples
          ref: ${{ matrix.upstreamCommit }}
          path: .sync/upstream
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-teams-sample-sync
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Install pinned Copilot CLI
        shell: bash
        run: npm install --global @github/copilot@1.0.82
      - uses: actions/download-artifact@v7
        with: { name: teams-sample-sync-plan, path: .sync }
      - name: Verify exact upstream commit and migrate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_SAMPLE: ${{ matrix.sample }}
          UPSTREAM_COMMIT: ${{ matrix.upstreamCommit }}
          MAX_AGENT_ATTEMPTS: ${{ inputs.maxAgentAttempts }}
        run: |
          test "$(git -C .sync/upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          node "$SYNC_TOOL/dist/cli.js" migrate --repo-root . --upstream-root .sync/upstream --plan .sync/plan.json --sample "$SYNC_SAMPLE" --max-attempts "$MAX_AGENT_ATTEMPTS" --output-directory ".sync/output/$SYNC_SAMPLE"
      - name: Report sample result
        if: always()
        shell: bash
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          if [ -f ".sync/output/$SYNC_SAMPLE/workflow-summary.md" ]; then
            cat ".sync/output/$SYNC_SAMPLE/workflow-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### $SYNC_SAMPLE: failed before a report was produced" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: teams-sample-sync-${{ matrix.sample }}
          path: .sync/output/${{ matrix.sample }}

  publish:
    needs: [plan, migrate]
    if: always() && inputs.createPr && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: teams-sample-sync-${{ matrix.sample }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.baseSha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-teams-sample-sync
      - id: download
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: teams-sample-sync-${{ matrix.sample }}
          path: .sync/result
      - id: ready
        name: Select publishable result
        shell: bash
        run: |
          ready=false
          if [ "${{ steps.download.outcome }}" = success ] && [ -f .sync/result/sync-result.json ]; then
            if [ "$(jq -r .status .sync/result/sync-result.json)" = updated ] && [ "$(jq -r .publishable .sync/result/sync-result.json)" = true ]; then
              ready=true
            fi
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Apply and verify validated patch
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          branch="automation/teams-sample-sync/$SYNC_SAMPLE"
          test "$(gh pr list --head "$branch" --state open --json number --jq length)" = 0
          git apply --index --binary .sync/result/change.patch
          node "$SYNC_TOOL/dist/cli.js" verify-patch --repo-root . --sample "$SYNC_SAMPLE" --result .sync/result/sync-result.json
      - name: Push draft PR
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          branch="automation/teams-sample-sync/$SYNC_SAMPLE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch"
          git commit -m "Sync Teams SDK sample: $SYNC_SAMPLE"
          git push --force-with-lease origin "$branch"
          gh pr create --draft --head "$branch" --title "Sync Teams SDK sample: $SYNC_SAMPLE" --body-file .sync/result/pr-body.md
