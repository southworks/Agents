name: Sync Teams SDK .NET samples

on:
  workflow_dispatch:
    inputs:
      sample:
        description: Selected sample name, or all
        required: true
        default: all
        type: string
      createPr:
        description: Create or update validated draft pull requests
        required: true
        default: false
        type: boolean
  # Enable only after the manual acceptance suite passes repeatedly.
  # schedule:
  #   - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  SYNC_SKILL: agent-plugins/agents-for-net/skills/sync-teams-dotnet-samples-to-agents-sdk
  SYNC_TOOL: agent-plugins/agents-for-net/skills/sync-teams-dotnet-samples-to-agents-sdk/scripts/dist
  SYNC_CONFIG: .github/teams-sample-sync

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout Agents repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout upstream Teams samples
        uses: actions/checkout@v7
        with:
          repository: OfficeDev/Microsoft-Teams-Samples
          ref: main
          fetch-depth: 0
          path: .sync/upstream
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.SYNC_SKILL }}/scripts/package-lock.json

      - name: Install deterministic sync dependencies
        run: |
          npm ci --prefix "$SYNC_SKILL/scripts"
          npm run build --prefix "$SYNC_SKILL/scripts"

      - name: Calculate synchronization plan
        env:
          REQUESTED_SAMPLE: ${{ inputs.sample || 'all' }}
        run: |
          args=()
          if [ "$REQUESTED_SAMPLE" != "all" ]; then
            args+=(--sample "$REQUESTED_SAMPLE")
          fi
          node "$SYNC_SKILL/scripts/dist/sync.js" \
            --repo-root . \
            plan \
            --upstream-root .sync/upstream \
            --output .sync/plan.json \
            "${args[@]}"

      - name: Export changed-sample matrix
        id: matrix
        run: |
          matrix=$(node -e "const p=require('./.sync/plan.json'); process.stdout.write(JSON.stringify(p.matrix))")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload synchronization plan
        uses: actions/upload-artifact@v7
        with:
          name: teams-sample-sync-plan
          path: .sync/plan.json
          if-no-files-found: error

      - name: Summarize detection
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const plan = require('./.sync/plan.json');
          const lines = ['## Teams sample synchronization plan', ''];
          for (const [name, sample] of Object.entries(plan.samples)) {
            lines.push(`- \`${name}\`: ${sample.status}`);
          }
          for (const name of plan.newSampleCandidates) {
            lines.push(`- \`${name}\`: new-sample-candidate`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          JS

  migrate:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    concurrency:
      group: teams-sample-sync-${{ matrix.sample }}
      cancel-in-progress: false
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Checkout Agents repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout upstream Teams samples
        uses: actions/checkout@v7
        with:
          repository: OfficeDev/Microsoft-Teams-Samples
          ref: main
          fetch-depth: 0
          path: .sync/upstream
          persist-credentials: false

      - name: Download synchronization plan
        uses: actions/download-artifact@v7
        with:
          name: teams-sample-sync-plan
          path: .sync

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.SYNC_SKILL }}/scripts/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.82

      - name: Install deterministic sync dependencies
        run: |
          trusted_tool="$RUNNER_TEMP/teams-sample-sync-tool"
          mkdir -p "$trusted_tool"
          cp -R "$SYNC_SKILL/scripts/." "$trusted_tool/"
          npm ci --prefix "$trusted_tool"
          npm run build --prefix "$trusted_tool"
          cp .sync/plan.json "$RUNNER_TEMP/teams-sample-sync-plan.json"
          git rev-parse HEAD > "$RUNNER_TEMP/teams-sample-sync-base-sha.txt"
          mkdir -p "$RUNNER_TEMP/teams-sample-sync-verification"
          echo "SYNC_TOOL=$trusted_tool/dist" >> "$GITHUB_ENV"
          echo "SYNC_PLAN=$RUNNER_TEMP/teams-sample-sync-plan.json" >> "$GITHUB_ENV"
          echo "SYNC_BASE_FILE=$RUNNER_TEMP/teams-sample-sync-base-sha.txt" >> "$GITHUB_ENV"
          echo "VERIFY_ROOT=$RUNNER_TEMP/teams-sample-sync-verification" >> "$GITHUB_ENV"
          echo "SYNC_GUARD_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run migration agent
        id: copilot_first
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_HOME: ${{ runner.temp }}/teams-sample-sync-copilot-first
          COPILOT_PROMPT: |
            Read and follow:
            - agent-plugins/agents-for-net/skills/sync-teams-dotnet-samples-to-agents-sdk/SKILL.md
            - agent-plugins/agents-for-net/skills/teams-sdk-to-agents-sdk-dotnet-migration/SKILL.md
            - agent-plugins/agents-sdk-common/skills/teams-app-manifest/SKILL.md
            - .github/teams-sample-sync/agent-prompt.md

            SYNC_SAMPLE=${{ matrix.sample }}
            PLAN_FILE=.sync/plan.json
            UPSTREAM_ROOT=.sync/upstream

            Process only this selected sample. Do not commit, push, create a pull request, or change protected tests.
        run: |
          mkdir -p .sync
          copilot --prompt "$COPILOT_PROMPT" \
            --silent \
            --available-tools='apply_patch,create,edit,view,grep,glob' \
            --allow-tool='write' \
            --deny-tool='shell,url' \
            --disable-builtin-mcps \
            --disallow-temp-dir \
            --no-ask-user \
            --no-auto-update \
            --no-color \
            --no-remote \
            --no-remote-export \
            | tee .sync/agent-result-first.txt

      - name: Enforce initial agent write boundary
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: node "$SYNC_TOOL/guard-agent-output.js" --repo-root . --sample "$SYNC_SAMPLE" --mode initial --base-ref "$SYNC_GUARD_BASE"

      - name: Restore selected destination sample
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: dotnet restore "samples/dotnet/teams/$SYNC_SAMPLE"

      - name: Verify first result
        id: verify_first
        continue-on-error: true
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          mkdir -p ".sync/output/$SYNC_SAMPLE"
          node "$SYNC_TOOL/sync.js" \
            --repo-root . \
            verify \
            --sample "$SYNC_SAMPLE" \
            --run-build \
            --no-restore \
            --validate-schema \
            --allow-proposed \
            --output "$VERIFY_ROOT/$SYNC_SAMPLE-first.json"

      - name: Detect proposed decision
        id: proposal_mode
        if: steps.verify_first.outcome == 'success'
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          count=$(node -e "const v=require(process.argv[1]); process.stdout.write(String(v.proposedDecisionIds.length))" "$VERIFY_ROOT/$SYNC_SAMPLE-first.json")
          if [ "$count" = "1" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          elif [ "$count" = "0" ]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "Only one proposed decision is allowed" >&2
            exit 1
          fi

      - name: Checkpoint safe migration baseline
        if: steps.verify_first.outcome == 'success'
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          if [ "${{ steps.proposal_mode.outputs.value }}" = "true" ]; then
            git config user.name "teams-sample-sync-checkpoint"
            git config user.email "teams-sample-sync-checkpoint@users.noreply.github.com"
            git add -- "samples/dotnet/teams/$SYNC_SAMPLE" .github/teams-sample-sync/decisions.yml
            git commit -m "Internal safe migration checkpoint for $SYNC_SAMPLE"
          fi
          echo "SYNC_GUARD_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Implement tentative decision candidate
        id: tentative
        if: steps.proposal_mode.outputs.value == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_HOME: ${{ runner.temp }}/teams-sample-sync-copilot-tentative
          COPILOT_PROMPT: |
            Read and follow:
            - agent-plugins/agents-for-net/skills/sync-teams-dotnet-samples-to-agents-sdk/SKILL.md
            - agent-plugins/agents-for-net/skills/teams-sdk-to-agents-sdk-dotnet-migration/SKILL.md
            - agent-plugins/agents-sdk-common/skills/teams-app-manifest/SKILL.md
            - .github/teams-sample-sync/agent-prompt.md

            SYNC_SAMPLE=${{ matrix.sample }}
            PLAN_FILE=.sync/plan.json
            UPSTREAM_ROOT=.sync/upstream

            Proposal implementation pass. Exactly one proposed decision exists. Implement only its recommended tentative behavior. Do not change its status or proposal metadata. Do not perform other migration work. Do not commit, push, create a pull request, or change protected tests.
        run: |
          copilot --prompt "$COPILOT_PROMPT" \
            --silent \
            --available-tools='apply_patch,create,edit,view,grep,glob' \
            --allow-tool='write' \
            --deny-tool='shell,url' \
            --disable-builtin-mcps \
            --disallow-temp-dir \
            --no-ask-user \
            --no-auto-update \
            --no-color \
            --no-remote \
            --no-remote-export \
            | tee .sync/agent-result-tentative.txt

      - name: Enforce tentative agent write boundary
        if: steps.tentative.outcome == 'success'
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: node "$SYNC_TOOL/guard-agent-output.js" --repo-root . --sample "$SYNC_SAMPLE" --mode stable --base-ref "$SYNC_GUARD_BASE"

      - name: Verify tentative candidate
        id: verify_candidate
        if: steps.tentative.outcome == 'success'
        continue-on-error: true
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          node "$SYNC_TOOL/sync.js" \
            --repo-root . \
            verify \
            --sample "$SYNC_SAMPLE" \
            --run-build \
            --no-restore \
            --validate-schema \
            --allow-proposed \
            --output "$VERIFY_ROOT/$SYNC_SAMPLE-candidate.json"

      - name: Run protected contract tests
        id: contract
        if: >-
          (steps.proposal_mode.outputs.value == 'false' || steps.verify_candidate.outcome == 'success') &&
          (matrix.sample == 'bot-ai-messages' || matrix.sample == 'bot-cards')
        continue-on-error: true
        run: >-
          dotnet test tests/dotnet/teams-sample-sync/TeamsSampleSync.ContractTests.csproj
          --nologo --verbosity minimal

      - name: Run independent reconciliation agent
        id: reconcile
        if: >-
          (steps.proposal_mode.outputs.value == 'false' || steps.verify_candidate.outcome == 'success') &&
          (steps.contract.outcome == 'success' || steps.contract.outcome == 'skipped')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_HOME: ${{ runner.temp }}/teams-sample-sync-copilot-reconcile
          COPILOT_PROMPT: |
            Read and follow:
            - agent-plugins/agents-for-net/skills/sync-teams-dotnet-samples-to-agents-sdk/SKILL.md
            - agent-plugins/agents-for-net/skills/teams-sdk-to-agents-sdk-dotnet-migration/SKILL.md
            - agent-plugins/agents-sdk-common/skills/teams-app-manifest/SKILL.md
            - .github/teams-sample-sync/agent-prompt.md

            SYNC_SAMPLE=${{ matrix.sample }}
            PLAN_FILE=.sync/plan.json
            UPSTREAM_ROOT=.sync/upstream

            This is the independent reconciliation pass. Process only this sample. If a proposed decision exists, preserve its tentative implementation without treating it as durable authority. The correct result must make no file changes. Do not commit, push, create a pull request, or change protected tests.
        run: |
          copilot --prompt "$COPILOT_PROMPT" \
            --silent \
            --available-tools='apply_patch,create,edit,view,grep,glob' \
            --allow-tool='write' \
            --deny-tool='shell,url' \
            --disable-builtin-mcps \
            --disallow-temp-dir \
            --no-ask-user \
            --no-auto-update \
            --no-color \
            --no-remote \
            --no-remote-export \
            | tee .sync/agent-result-second.txt

      - name: Enforce reconciliation agent write boundary
        if: steps.reconcile.outcome == 'success'
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: node "$SYNC_TOOL/guard-agent-output.js" --repo-root . --sample "$SYNC_SAMPLE" --mode stable --base-ref "$SYNC_GUARD_BASE"

      - name: Verify repeated result
        id: verify_second
        if: steps.reconcile.outcome == 'success'
        continue-on-error: true
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          node "$SYNC_TOOL/sync.js" \
            --repo-root . \
            verify \
            --sample "$SYNC_SAMPLE" \
            --validate-schema \
            --allow-proposed \
            --output "$VERIFY_ROOT/$SYNC_SAMPLE-second.json"

      - name: Capture exact decision proposal
        id: proposal
        if: steps.verify_first.outcome == 'success' && steps.verify_second.outcome == 'success'
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          count=$(node -e "const v=require(process.argv[1]); process.stdout.write(String(v.proposedDecisionIds.length))" "$VERIFY_ROOT/$SYNC_SAMPLE-second.json")
          if [ "$count" = "1" ]; then
            first_digest=$(jq -r .outputDigest "$VERIFY_ROOT/$SYNC_SAMPLE-candidate.json")
            second_digest=$(jq -r .outputDigest "$VERIFY_ROOT/$SYNC_SAMPLE-second.json")
            test "$first_digest" = "$second_digest"
            node "$SYNC_TOOL/sync.js" \
              --repo-root . \
              capture-proposal \
              --sample "$SYNC_SAMPLE" \
              --plan "$SYNC_PLAN" \
              --verification "$VERIFY_ROOT/$SYNC_SAMPLE-second.json" \
              --output ".sync/output/$SYNC_SAMPLE/proposal.json"
            echo "value=true" >> "$GITHUB_OUTPUT"
          elif [ "$count" = "0" ]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "Only one proposed decision is allowed" >&2
            exit 1
          fi

      - name: Finalize idempotent state
        id: finalize
        if: >-
          steps.verify_first.outcome == 'success' &&
          steps.verify_second.outcome == 'success' &&
          steps.proposal.outputs.value == 'false'
        continue-on-error: true
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          node "$SYNC_TOOL/sync.js" \
            --repo-root . \
            finalize \
            --sample "$SYNC_SAMPLE" \
            --plan "$SYNC_PLAN" \
            --first-verification "$VERIFY_ROOT/$SYNC_SAMPLE-first.json" \
            --second-verification "$VERIFY_ROOT/$SYNC_SAMPLE-second.json" \
            --output ".sync/output/$SYNC_SAMPLE/final-state.json"

      - name: Create validated patch
        if: steps.finalize.outcome == 'success' || steps.proposal.outputs.value == 'true'
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          base_sha=$(cat "$SYNC_BASE_FILE")
          git add -N -- \
            "samples/dotnet/teams/$SYNC_SAMPLE" \
            .github/teams-sample-sync/decisions.yml
          if [ -f ".github/teams-sample-sync/state/$SYNC_SAMPLE.lock.json" ]; then
            git add -N -- ".github/teams-sample-sync/state/$SYNC_SAMPLE.lock.json"
          fi
          if [ -d .github/teams-sample-sync/proposals ]; then
            git add -N -- .github/teams-sample-sync/proposals
          fi
          git diff --binary "$base_sha" -- \
            "samples/dotnet/teams/$SYNC_SAMPLE" \
            .github/teams-sample-sync/decisions.yml \
            .github/teams-sample-sync/proposals \
            ".github/teams-sample-sync/state/$SYNC_SAMPLE.lock.json" \
            > ".sync/output/$SYNC_SAMPLE/change.patch"

      - name: Copy agent report
        if: always()
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          mkdir -p ".sync/output/$SYNC_SAMPLE"
          if [ -f .sync/agent-result-first.txt ]; then
            cp .sync/agent-result-first.txt ".sync/output/$SYNC_SAMPLE/agent-result-first.txt"
          fi
          if [ -f .sync/agent-result-second.txt ]; then
            cp .sync/agent-result-second.txt ".sync/output/$SYNC_SAMPLE/agent-result-second.txt"
          fi
          if [ -f .sync/agent-result-tentative.txt ]; then
            cp .sync/agent-result-tentative.txt ".sync/output/$SYNC_SAMPLE/agent-result-tentative.txt"
          fi
          for phase in first candidate second; do
            if [ -f "$VERIFY_ROOT/$SYNC_SAMPLE-$phase.json" ]; then
              cp "$VERIFY_ROOT/$SYNC_SAMPLE-$phase.json" ".sync/output/$SYNC_SAMPLE/verify-$phase.json"
            fi
          done

      - name: Upload sample result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teams-sample-sync-${{ matrix.sample }}
          path: .sync/output/${{ matrix.sample }}
          if-no-files-found: error

      - name: Fail unresolved sample
        if: >-
          steps.proposal.outputs.value != 'true' &&
          (steps.verify_first.outcome != 'success' ||
          steps.contract.outcome == 'failure' ||
          steps.reconcile.outcome != 'success' ||
          steps.verify_second.outcome != 'success' ||
          steps.finalize.outcome != 'success')
        run: exit 1

  create-pr:
    needs: [detect, migrate]
    if: >-
      always() &&
      (github.event_name == 'schedule' || inputs.createPr) &&
      needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    concurrency:
      group: teams-sample-sync-${{ matrix.sample }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout Agents repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.SYNC_SKILL }}/scripts/package-lock.json

      - name: Install deterministic sync dependencies
        run: |
          npm ci --prefix "$SYNC_SKILL/scripts"
          npm run build --prefix "$SYNC_SKILL/scripts"

      - name: Download sample result
        uses: actions/download-artifact@v7
        with:
          name: teams-sample-sync-${{ matrix.sample }}
          path: .sync/result

      - name: Download synchronization plan
        uses: actions/download-artifact@v7
        with:
          name: teams-sample-sync-plan
          path: .sync/plan

      - name: Check readiness
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          branch="automation/teams-sample-sync/$SYNC_SAMPLE"
          blocked=$(gh pr list --head "$branch" --state open --json number --jq 'length > 0')
          if [ "$blocked" = "true" ]; then
            echo "An open sample-sync pull request exists; branch remains unchanged until merge or close."
            echo "value=false" >> "$GITHUB_OUTPUT"
          elif [ -s .sync/result/change.patch ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply validated patch
        if: steps.ready.outputs.value == 'true'
        run: git apply --index --binary .sync/result/change.patch

      - name: Validate applied patch
        if: steps.ready.outputs.value == 'true'
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          decision_id=""
          if [ -f .sync/result/proposal.json ]; then
            decision_id=$(jq -r .decisionId .sync/result/proposal.json)
          fi
          while IFS= read -r changed_path; do
            case "$changed_path" in
              "samples/dotnet/teams/$SYNC_SAMPLE/"*|".github/teams-sample-sync/decisions.yml"|".github/teams-sample-sync/state/$SYNC_SAMPLE.lock.json") ;;
              ".github/teams-sample-sync/proposals/$decision_id.patch") test -n "$decision_id" ;;
              *) echo "Applied patch contains an unauthorized path: $changed_path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)

          verify_args=()
          if [ -n "$decision_id" ]; then
            verify_args+=(--allow-proposed)
            expected=$(jq -r .proposal.candidateOutputDigest .sync/result/proposal.json)
          else
            expected=$(jq -r .outputDigest .sync/result/final-state.json)
          fi
          node "$SYNC_SKILL/scripts/dist/sync.js" \
            --repo-root . \
            verify \
            --sample "$SYNC_SAMPLE" \
            "${verify_args[@]}" \
            --output .sync/applied-verification.json
          test "$(jq -r .passed .sync/applied-verification.json)" = "true"
          test "$(jq -r .outputDigest .sync/applied-verification.json)" = "$expected"

      - name: Commit and push deterministic branch
        if: steps.ready.outputs.value == 'true'
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          branch="automation/teams-sample-sync/$SYNC_SAMPLE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -m "Sync Teams SDK sample: $SYNC_SAMPLE"
          git push --force-with-lease origin "$branch"

      - name: Create or update draft pull request
        if: steps.ready.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          branch="automation/teams-sample-sync/$SYNC_SAMPLE"
          body_file=.sync/pr-body.md
          {
            echo "Automated synchronization for \`$SYNC_SAMPLE\`."
            echo
            echo "Detailed agent reports are in the [workflow artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo "The pull request remains draft for human review. The automation never merges."
            node - "$SYNC_SAMPLE" <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const { parse } = require(path.resolve(process.env.SYNC_SKILL, 'scripts/node_modules/yaml'));
          const sample = process.argv[2];
          const plan = require(path.resolve('.sync/plan/plan.json')).samples[sample];
          const previous = plan.previousState || {};
          console.log('\n## Provenance\n');
          console.log(`- Previous upstream commit: \`${previous.upstreamCommit || 'not recorded'}\``);
          console.log(`- Current upstream commit: \`${plan.upstreamCommit}\``);
          console.log(`- Current .NET source tree: \`${plan.sourceTree}\``);
          console.log(`- Input digest: \`${plan.inputDigest}\``);
          console.log(`- Changed inputs: \`${plan.changedComponents.join(', ') || 'none'}\``);
          const finalPath = '.sync/result/final-state.json';
          const final = fs.existsSync(finalPath) ? require(path.resolve(finalPath)) : undefined;
          console.log('\n## Validation\n');
          if (final) {
            console.log(`- Output digest: \`${final.outputDigest}\``);
            console.log('- Build, manifest schema/package, and repeated-output gates passed.');
          } else {
            console.log('- Tentative implementation passed validation. State does not advance until the decision is resolved.');
          }
          console.log('- Credentialed Teams, Entra, Graph, Azure Bot, and portal checks remain external when applicable.');
          const document = parse(fs.readFileSync('.github/teams-sample-sync/decisions.yml', 'utf8'));
          const proposals = document.decisions.filter(
            (item) => [sample, '*'].includes(item.sample) && item.status === 'proposed',
          );
          if (proposals.length) {
            console.log('\n## Decisions that require human input\n');
            for (const item of proposals) {
              console.log(`### ${item.id}: ${item.question || 'Decision required'}\n`);
              console.log(`Recommendation: ${item.recommendation || 'Not supplied'}\n`);
              console.log(`Impact: ${item.impact || 'Not supplied'}\n`);
              console.log('Review the exact tentative code in this pull request. Apply one decision suggestion below.');
            }
          }
          JS
          } > "$body_file"
          number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "Sync Teams SDK sample: $SYNC_SAMPLE" --body-file "$body_file"
          else
            gh pr create --draft --head "$branch" --title "Sync Teams SDK sample: $SYNC_SAMPLE" --body-file "$body_file"
            number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          fi

          proposal_file=.sync/result/proposal.json
          if [ -f "$proposal_file" ]; then
            gh label create decision-required --color D93F0B --description "Product decision required" --force
            gh pr edit "$number" --add-label decision-required
            decision_id=$(node -e "process.stdout.write(require('./.sync/result/proposal.json').decisionId)")
            status_line=$(awk -v id="$decision_id" '$0 ~ "- id: " id { found=1 } found && /status: proposed/ { print NR; exit }' .github/teams-sample-sync/decisions.yml)
            head_sha=$(git rev-parse HEAD)
            gh api --method POST "repos/${{ github.repository }}/statuses/$head_sha" \
              -f state=success \
              -f context=teams-sample-sync/proposal-provenance \
              -f description="Validated sample-sync proposal from run ${{ github.run_id }}" \
              -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            test -n "$status_line"
            existing=$(gh api "repos/${{ github.repository }}/pulls/$number/comments" --paginate --jq ".[] | select(.commit_id == \"$head_sha\") | .body")
            for outcome in approved rejected; do
              marker="<!-- teams-sample-decision:$decision_id:$outcome -->"
              if ! grep -Fq "$marker" <<< "$existing"; then
                if [ "$outcome" = "approved" ]; then
                  action=Approve
                  effect="Keep the tentative implementation. This does not approve the pull request for merge."
                else
                  action=Reject
                  effect="Remove only the exact tentative implementation. Keep the rejection as durable intent."
                fi
                body=$(printf '%s\n**%s `%s`** — %s\n\n```suggestion\n  status: %s\n```' "$marker" "$action" "$decision_id" "$effect" "$outcome")
                gh api --method POST "repos/${{ github.repository }}/pulls/$number/comments" \
                  -f body="$body" \
                  -f commit_id="$head_sha" \
                  -f path=.github/teams-sample-sync/decisions.yml \
                  -F line="$status_line" \
                  -f side=RIGHT
              fi
            done
          else
            gh pr edit "$number" --remove-label decision-required 2>/dev/null || true
          fi
