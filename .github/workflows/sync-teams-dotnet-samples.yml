name: Sync Teams .NET samples

on:
  # Runs weekly at 00:00 UTC each Sunday.
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      sample:
        description: Selected sample or all
        required: true
        type: choice
        default: all
        options:
          - all
          - agent-targeted-messages
          - bot-ai-messages
          - bot-attachments
          - bot-cards
          - bot-meetings
          - bot-message-extensions
          - bot-task-modules
      publish:
        description: Publish one branch and handoff issue after all migrations pass
        type: boolean
        default: false

env:
  SYNC_TOOL: automation/teams-sample-sync
  TEAMS_SAMPLES_REPOSITORY: OfficeDev/Microsoft-Teams-Samples

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      baseSha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TEAMS_SAMPLES_REPOSITORY }}
          ref: main
          path: .sync/upstream
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: automation/teams-sample-sync/package-lock.json
      - run: npm ci --prefix "$SYNC_TOOL" && npm run build --prefix "$SYNC_TOOL"
      - id: plan
        env:
          SYNC_SAMPLE: ${{ github.event_name == 'schedule' && 'all' || inputs.sample }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sample_arg=(); [ "$SYNC_SAMPLE" = all ] || sample_arg=(--sample "$SYNC_SAMPLE")
          node "$SYNC_TOOL/dist/cli.js" plan --repo-root . --upstream-root .sync/upstream "${sample_arg[@]}" --output .sync/plan.json
          echo "matrix=$(jq -c .matrix .sync/plan.json)" >> "$GITHUB_OUTPUT"
          jq -r '.samples | to_entries[] | "- \(.key): \(.value.status)"' .sync/plan.json >> "$GITHUB_STEP_SUMMARY"
          if ! jq -e '[.samples[] | select(.status == "upstream-removed")] | length == 0' .sync/plan.json; then
            echo "::error::A configured sample was removed upstream; coordinated publication is blocked."
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: teams-sample-sync-plan
          path: .sync/plan.json

  migrate:
    name: migrate · ${{ matrix.sample }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: teams-sample-sync-${{ matrix.sample }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.baseSha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TEAMS_SAMPLES_REPOSITORY }}
          ref: ${{ matrix.upstreamCommit }}
          path: .sync/upstream
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: automation/teams-sample-sync/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: npm ci --prefix "$SYNC_TOOL" && npm run build --prefix "$SYNC_TOOL"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: teams-sample-sync-plan
          path: .sync
      - name: Migrate and validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_SAMPLE: ${{ matrix.sample }}
          UPSTREAM_COMMIT: ${{ matrix.upstreamCommit }}
        run: |
          test "$(git -C .sync/upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          node "$SYNC_TOOL/dist/cli.js" migrate --repo-root . --upstream-root .sync/upstream --plan .sync/plan.json --sample "$SYNC_SAMPLE" --output-directory ".sync/output/$SYNC_SAMPLE"
      - name: Report sample result
        if: always()
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          if [ -f ".sync/output/$SYNC_SAMPLE/workflow-summary.md" ]; then cat ".sync/output/$SYNC_SAMPLE/workflow-summary.md" >> "$GITHUB_STEP_SUMMARY"; else echo "### $SYNC_SAMPLE: failed before a report was produced" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: teams-sample-sync-${{ matrix.sample }}
          path: .sync/output/${{ matrix.sample }}
          if-no-files-found: warn

  publish:
    name: publish coordinated sync
    needs: [plan, migrate]
    if: (github.event_name == 'schedule' || inputs.publish) && needs.plan.result == 'success' && needs.migrate.result == 'success' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    concurrency:
      group: teams-sample-sync-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.baseSha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: automation/teams-sample-sync/package-lock.json
      - run: npm ci --prefix "$SYNC_TOOL" && npm run build --prefix "$SYNC_TOOL"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: teams-sample-sync-plan
          path: .sync
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: teams-sample-sync-*
          path: .sync/results
      - name: Check every verified patch against the planned base
        env:
          BASE_SHA: ${{ needs.plan.outputs.baseSha }}
        run: |
          repo_root="$PWD"
          while IFS= read -r sample; do
            result="$repo_root/.sync/results/teams-sample-sync-$sample"
            test -f "$result/sync-result.json"
            test "$(jq -r .publishable "$result/sync-result.json")" = true
            test "$(jq -r .baseSha "$result/sync-result.json")" = "$BASE_SHA"
            verify="$repo_root/.sync/verify/$sample"
            git worktree add --detach "$verify" "$BASE_SHA"
            git -C "$verify" apply --index --binary "$result/change.patch"
            node "$repo_root/$SYNC_TOOL/dist/cli.js" verify-patch --repo-root "$verify" --sample "$sample" --result "$result/sync-result.json"
            git worktree remove --force "$verify"
          done < <(jq -r '.matrix[].sample' .sync/plan.json)
      - name: Create one branch with a commit per sample
        env:
          BASE_SHA: ${{ needs.plan.outputs.baseSha }}
        run: |
          branch="automation/teams-sample-sync/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "$branch" "$BASE_SHA"
          while IFS= read -r sample; do
            git apply --index --binary ".sync/results/teams-sample-sync-$sample/change.patch"
            git commit -m "Sync Teams SDK sample: $sample"
          done < <(jq -r '.matrix[].sample' .sync/plan.json)
          echo "SYNC_BRANCH=$branch" >> "$GITHUB_ENV"
      - name: Prepare consolidated handoff
        env:
          BASE_SHA: ${{ needs.plan.outputs.baseSha }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > .sync/artifacts.json
          jq -s --arg base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/" \
            '[.[].artifacts[]] | sort_by(.id) | map({key: .name, value: ($base + (.id | tostring))}) | from_entries' \
            .sync/artifacts.json > .sync/artifact-urls.json
          node "$SYNC_TOOL/dist/cli.js" prepare-handoff \
            --repo-root . --plan .sync/plan.json --results-directory .sync/results \
            --base-sha "$BASE_SHA" --run-url "$RUN_URL" \
            --artifact-urls .sync/artifact-urls.json --output-directory .sync/handoff
      - id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: teams-sample-sync-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sync/handoff
      - name: Prepare handoff issue
        env:
          BASE_SHA: ${{ needs.plan.outputs.baseSha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          HANDOFF_URL: ${{ steps.handoff.outputs.artifact-url }}
        run: |
          node "$SYNC_TOOL/dist/cli.js" prepare-issue \
            --repo-root . --plan .sync/plan.json --results-directory .sync/results \
            --base-sha "$BASE_SHA" --branch "$SYNC_BRANCH" --base-branch "$BASE_BRANCH" \
            --repository "$GITHUB_REPOSITORY" --run-url "$RUN_URL" \
            --handoff-url "$HANDOFF_URL" --output-directory .sync/handoff
      - name: Push branch and create handoff issue
        run: |
          git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          if ! issue_url="$(gh issue create --title "$(cat .sync/handoff/issue-title.txt)" --body-file .sync/handoff/issue-body.md)"; then
            git push origin --delete "$SYNC_BRANCH"
            exit 1
          fi
          echo "### Coordinated sync published" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`$SYNC_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Handoff issue: $issue_url" >> "$GITHUB_STEP_SUMMARY"
