name: Sync Teams .NET samples

on:
  workflow_dispatch:
    inputs:
      sample:
        description: Selected sample or all
        required: true
        default: all
      createPr:
        description: Create draft pull requests
        type: boolean
        default: false

env:
  SYNC_TOOL: automation/teams-sample-sync
  # For fork testing only, change this repository and run with createPr disabled.
  TEAMS_SAMPLES_REPOSITORY: OfficeDev/Microsoft-Teams-Samples

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      baseSha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TEAMS_SAMPLES_REPOSITORY }}
          ref: main
          path: .sync/upstream
          persist-credentials: false
      - uses: ./automation/teams-sample-sync/actions/setup
      - id: plan
        uses: ./automation/teams-sample-sync/actions/plan
        with:
          sample: ${{ inputs.sample }}

  migrate:
    name: migrate · ${{ matrix.sample }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: teams-sample-sync-${{ matrix.sample }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.baseSha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TEAMS_SAMPLES_REPOSITORY }}
          ref: ${{ matrix.upstreamCommit }}
          path: .sync/upstream
          fetch-depth: 0
          persist-credentials: false
      - uses: ./automation/teams-sample-sync/actions/setup
      - uses: ./automation/teams-sample-sync/actions/migrate
        with:
          sample: ${{ matrix.sample }}
          upstreamCommit: ${{ matrix.upstreamCommit }}

  publish:
    name: publish · ${{ matrix.sample }}
    needs: [plan, migrate]
    if: always() && inputs.createPr && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: teams-sample-sync-${{ matrix.sample }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.baseSha }}
          fetch-depth: 0
      - uses: ./automation/teams-sample-sync/actions/setup
      - uses: ./automation/teams-sample-sync/actions/publisher
        with:
          sample: ${{ matrix.sample }}
