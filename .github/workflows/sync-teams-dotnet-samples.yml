name: Sync Teams .NET samples

on:
  pull_request_target:
    types: [opened, synchronize, edited, reopened, ready_for_review]
  # Runs weekly at 00:00 UTC each Sunday.
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      sample:
        description: Selected sample or all
        required: true
        type: choice
        default: all
        options:
          - all
          - agent-targeted-messages
          - bot-ai-messages
          - bot-attachments
          - bot-cards
          - bot-meetings
          - bot-message-extensions
          - bot-task-modules
      publish:
        description: Create a handoff issue and assign Copilot after all migrations pass
        type: boolean
        default: false

env:
  SYNC_TOOL: automation/teams-sample-sync
  TEAMS_SAMPLES_REPOSITORY: OfficeDev/Microsoft-Teams-Samples

jobs:
  verify-publication:
    name: Verify prepared Teams sync publication
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      # Execute only trusted base-branch code; inspect the PR tree without checking it out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: automation/teams-sample-sync/package-lock.json
      - run: npm ci --prefix "$SYNC_TOOL" && npm run build --prefix "$SYNC_TOOL"
      - name: Compare PR with prepared publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$SYNC_TOOL/dist/check-publication.js"

  plan:
    if: github.event_name != 'pull_request_target' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      baseSha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TEAMS_SAMPLES_REPOSITORY }}
          ref: main
          path: .sync/upstream
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: automation/teams-sample-sync/package-lock.json
      - run: npm ci --prefix "$SYNC_TOOL" && npm run build --prefix "$SYNC_TOOL"
      - id: plan
        env:
          SYNC_SAMPLE: ${{ github.event_name == 'schedule' && 'all' || inputs.sample }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sample_arg=(); [ "$SYNC_SAMPLE" = all ] || sample_arg=(--sample "$SYNC_SAMPLE")
          node "$SYNC_TOOL/dist/cli.js" plan --repo-root . --upstream-root .sync/upstream "${sample_arg[@]}" --output .sync/plan.json
          echo "matrix=$(jq -c .matrix .sync/plan.json)" >> "$GITHUB_OUTPUT"
          jq -r '.samples | to_entries[] | "- \(.key): \(.value.status)"' .sync/plan.json >> "$GITHUB_STEP_SUMMARY"
          if ! jq -e '[.samples[] | select(.status == "upstream-removed")] | length == 0' .sync/plan.json; then
            echo "::error::A configured sample was removed upstream; coordinated publication is blocked."
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: teams-sample-sync-plan
          path: .sync/plan.json

  migrate:
    name: migrate · ${{ matrix.sample }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: teams-sample-sync-${{ matrix.sample }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.baseSha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TEAMS_SAMPLES_REPOSITORY }}
          ref: ${{ matrix.upstreamCommit }}
          path: .sync/upstream
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: automation/teams-sample-sync/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: npm ci --prefix "$SYNC_TOOL" && npm run build --prefix "$SYNC_TOOL"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: teams-sample-sync-plan
          path: .sync
      - name: Migrate and validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_SAMPLE: ${{ matrix.sample }}
          UPSTREAM_COMMIT: ${{ matrix.upstreamCommit }}
        run: |
          test "$(git -C .sync/upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          node "$SYNC_TOOL/dist/cli.js" migrate --repo-root . --upstream-root .sync/upstream --plan .sync/plan.json --sample "$SYNC_SAMPLE" --output-directory ".sync/output/$SYNC_SAMPLE"
      - name: Report sample result
        if: always()
        env:
          SYNC_SAMPLE: ${{ matrix.sample }}
        run: |
          if [ -f ".sync/output/$SYNC_SAMPLE/workflow-summary.md" ]; then cat ".sync/output/$SYNC_SAMPLE/workflow-summary.md" >> "$GITHUB_STEP_SUMMARY"; else echo "### $SYNC_SAMPLE: failed before a report was produced" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: teams-sample-sync-${{ matrix.sample }}
          path: .sync/output/${{ matrix.sample }}
          if-no-files-found: warn

  publish:
    name: hand off coordinated sync
    needs: [plan, migrate]
    if: (github.event_name == 'schedule' || inputs.publish) && needs.plan.result == 'success' && needs.migrate.result == 'success' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    concurrency:
      group: teams-sample-sync-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.baseSha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: automation/teams-sample-sync/package-lock.json
      - run: npm ci --prefix "$SYNC_TOOL" && npm run build --prefix "$SYNC_TOOL"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: teams-sample-sync-plan
          path: .sync
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: teams-sample-sync-*
          path: .sync/results
      - name: Check every verified patch against the planned base
        env:
          BASE_SHA: ${{ needs.plan.outputs.baseSha }}
        run: |
          repo_root="$PWD"
          while IFS= read -r sample; do
            result="$repo_root/.sync/results/teams-sample-sync-$sample"
            test -f "$result/sync-result.json"
            test "$(jq -r .publishable "$result/sync-result.json")" = true
            test "$(jq -r .baseSha "$result/sync-result.json")" = "$BASE_SHA"
            verify="$repo_root/.sync/verify/$sample"
            git worktree add --detach "$verify" "$BASE_SHA"
            git -C "$verify" apply --index --binary "$result/change.patch"
            node "$repo_root/$SYNC_TOOL/dist/cli.js" verify-patch --repo-root "$verify" --sample "$sample" --result "$result/sync-result.json"
            git worktree remove --force "$verify"
          done < <(jq -r '.matrix[].sample' .sync/plan.json)
      - name: Prepare handoff issue metadata
        env:
          BASE_SHA: ${{ needs.plan.outputs.baseSha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          HANDOFF_ARTIFACT: teams-sample-sync-handoff-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node "$SYNC_TOOL/dist/cli.js" prepare-issue \
            --repo-root . --plan .sync/plan.json --results-directory .sync/results \
            --base-sha "$BASE_SHA" --base-branch "$BASE_BRANCH" \
            --repository "$GITHUB_REPOSITORY" --run-url "$RUN_URL" \
            --handoff-artifact "$HANDOFF_ARTIFACT" --output-directory .sync/issue
      - name: Create or reuse an unassigned handoff issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ needs.plan.outputs.baseSha }}
        run: |
          test -n "$GH_TOKEN" || { echo 'COPILOT_ASSIGNMENT_TOKEN is required to assign Copilot'; exit 1; }
          current_base="$(git ls-remote origin "refs/heads/$BASE_BRANCH" | cut -f1)"
          test "$current_base" = "$BASE_SHA" || { echo 'Target branch moved since planning; rerun the sync'; exit 1; }
          handoff_id="$(cat .sync/issue/handoff-id.txt)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            > .sync/issue/open-issues.json
          existing_number="$(jq -sr --arg marker "teams-sample-sync-handoff:$handoff_id" \
            '[.[][] | select(.pull_request == null and ((.body // "") | contains($marker)))]
              | first | .number // empty' .sync/issue/open-issues.json)"
          if [ -n "$existing_number" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$existing_number" > .sync/issue/issue-response.json
          else
            jq -n --rawfile title .sync/issue/issue-title.txt --rawfile body .sync/issue/issue-body.md \
              '{title: ($title | rtrimstr("\n")), body: $body}' > .sync/issue/issue-request.json
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues" \
              --input .sync/issue/issue-request.json > .sync/issue/issue-response.json
          fi
          issue_number="$(jq -r .number .sync/issue/issue-response.json)"
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"
          if jq -e '.assignees | any(.login == "Copilot" or .login == "copilot-swe-agent[bot]")' \
            .sync/issue/issue-response.json > /dev/null; then
            echo 'assigned=true' >> "$GITHUB_OUTPUT"
            echo "### Coordinated sync already handed to Copilot" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'assigned=false' >> "$GITHUB_OUTPUT"
            echo "### Handoff issue reserved; artifact preparation pending" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Handoff issue: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$issue_number" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare consolidated handoff
        if: steps.issue.outputs.assigned != 'true'
        env:
          BASE_SHA: ${{ needs.plan.outputs.baseSha }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > .sync/artifacts.json
          jq -s --arg base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/" \
            '[.[].artifacts[]] | sort_by(.id) | map({key: .name, value: ($base + (.id | tostring))}) | from_entries' \
            .sync/artifacts.json > .sync/artifact-urls.json
          node "$SYNC_TOOL/dist/cli.js" prepare-handoff \
            --repo-root . --plan .sync/plan.json --results-directory .sync/results \
            --base-sha "$BASE_SHA" --run-url "$RUN_URL" \
            --artifact-urls .sync/artifact-urls.json --issue-number "$ISSUE_NUMBER" \
            --output-directory .sync/handoff
      - id: handoff
        if: steps.issue.outputs.assigned != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: teams-sample-sync-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sync/handoff
          if-no-files-found: error
      - name: Prepare handoff issue
        if: steps.issue.outputs.assigned != 'true'
        env:
          BASE_SHA: ${{ needs.plan.outputs.baseSha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          HANDOFF_URL: ${{ steps.handoff.outputs.artifact-url }}
          HANDOFF_ARTIFACT: teams-sample-sync-handoff-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node "$SYNC_TOOL/dist/cli.js" prepare-issue \
            --repo-root . --plan .sync/plan.json --results-directory .sync/results \
            --base-sha "$BASE_SHA" --base-branch "$BASE_BRANCH" \
            --repository "$GITHUB_REPOSITORY" --run-url "$RUN_URL" --handoff-url "$HANDOFF_URL" \
            --handoff-artifact "$HANDOFF_ARTIFACT" --output-directory .sync/issue
      - name: Complete handoff issue and assign Copilot
        if: steps.issue.outputs.assigned != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ needs.plan.outputs.baseSha }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          test -n "$GH_TOKEN" || { echo 'COPILOT_ASSIGNMENT_TOKEN is required to assign Copilot'; exit 1; }
          current_base="$(git ls-remote origin "refs/heads/$BASE_BRANCH" | cut -f1)"
          test "$current_base" = "$BASE_SHA" || { echo 'Target branch moved since planning; rerun the sync'; exit 1; }
          jq -n \
            --rawfile title .sync/issue/issue-title.txt \
            --rawfile body .sync/issue/issue-body.md \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg base "$BASE_BRANCH" \
            '{title: ($title | rtrimstr("\n")), body: $body,
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {target_repo: $repository, base_branch: $base,
                custom_instructions: "Publication only: follow the issue instructions, apply only the supplied patches, and copy pr-body.md verbatim. Report blockers without adding fixes.",
                custom_agent: "", model: ""}}' > .sync/issue/issue-request.json
          jq '{title, body}' .sync/issue/issue-request.json > .sync/issue/issue-update.json
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            --input .sync/issue/issue-update.json > /dev/null
          jq '{assignees, agent_assignment}' .sync/issue/issue-request.json > .sync/issue/assignment-request.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/assignees" \
            --input .sync/issue/assignment-request.json > .sync/issue/issue-response.json
          jq -e '.assignees | any(.login == "Copilot" or .login == "copilot-swe-agent[bot]")' \
            .sync/issue/issue-response.json > /dev/null || { echo 'Issue was not assigned to Copilot'; exit 1; }
          issue_url="$(jq -r .html_url .sync/issue/issue-response.json)"
          echo "### Coordinated sync handed to Copilot" >> "$GITHUB_STEP_SUMMARY"
          echo "Handoff issue: $issue_url" >> "$GITHUB_STEP_SUMMARY"
