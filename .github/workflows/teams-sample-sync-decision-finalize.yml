name: Finalize Teams sample sync decision

on:
  workflow_run:
    workflows: [Check Teams sample sync decision]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

env:
  SYNC_SKILL: agent-plugins/agents-for-net/skills/sync-teams-dotnet-samples-to-agents-sdk

jobs:
  gate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.read.outputs.eligible }}
      sample: ${{ steps.read.outputs.sample }}
    steps:
      - name: Find decision marker
        id: marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker_name="teams-sample-decision-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}"
          artifacts=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts")
          count=$(jq --arg name "$marker_name" '[.artifacts[] | select(.name == $name)] | length' <<< "$artifacts")
          test "$count" -le 1
          if [ "$count" = "1" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      - name: Download decision marker
        if: steps.marker.outputs.exists == 'true'
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: teams-sample-decision-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: .sync/attested

      - name: Read decision marker
        id: read
        if: steps.marker.outputs.exists == 'true'
        run: |
          echo "eligible=$(jq -r '.eligible == true' .sync/attested/attestation.json)" >> "$GITHUB_OUTPUT"
          echo "sample=$(jq -r '.sample // "none"' .sync/attested/attestation.json)" >> "$GITHUB_OUTPUT"

  finalize:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: teams-sample-sync-${{ needs.gate.outputs.sample }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download read-only check attestation
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: teams-sample-decision-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: .sync/attested

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.SYNC_SKILL }}/scripts/package-lock.json

      - name: Install trusted sync tool
        run: |
          npm ci --prefix "$SYNC_SKILL/scripts"
          npm run build --prefix "$SYNC_SKILL/scripts"

      - name: Verify current pull-request head and authority
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metadata=.sync/attested/attestation.json
          test -f "$metadata"
          pr=$(jq -r .pullRequest "$metadata")
          actor=$(jq -r .actor "$metadata")
          branch=$(jq -r .branch "$metadata")
          sha=$(jq -r .headSha "$metadata")
          sample=$(jq -r .sample "$metadata")
          decision_id=$(jq -r .decisionId "$metadata")
          permission=$(gh api "repos/${{ github.repository }}/collaborators/$actor/permission" --jq .permission)
          case "$permission" in admin|maintain|write) ;; *) echo "Write permission required" >&2; exit 1 ;; esac
          pr_json=$(gh api "repos/${{ github.repository }}/pulls/$pr")
          test "$(jq -r .head.repo.full_name <<< "$pr_json")" = "${{ github.repository }}"
          test "$(jq -r .head.ref <<< "$pr_json")" = "$branch"
          test "$(jq -r .head.sha <<< "$pr_json")" = "$sha"
          test "$branch" = "automation/teams-sample-sync/$sample"
          test "$(jq -r .state <<< "$pr_json")" = "open"
          test "$(jq -r .draft <<< "$pr_json")" = "true"
          test "$(jq -r .base.ref <<< "$pr_json")" = "${{ github.event.repository.default_branch }}"
          commit_json=$(gh api "repos/${{ github.repository }}/commits/$sha")
          test "$(jq '.parents | length' <<< "$commit_json")" = "1"
          proposal_sha=$(jq -r '.parents[0].sha' <<< "$commit_json")
          status_json=$(gh api "repos/${{ github.repository }}/commits/$proposal_sha/status")
          jq -e \
            --arg repository "${{ github.repository }}" \
            '[.statuses[] | select(
              .context == "teams-sample-sync/proposal-provenance" and
              .state == "success" and
              .creator.login == "github-actions[bot]" and
              (.target_url | test("/" + $repository + "/actions/runs/[0-9]+$"))
            )] | length == 1' <<< "$status_json" >/dev/null
          while IFS= read -r changed_path; do
            case "$changed_path" in
              "samples/dotnet/teams/$sample/"*|".github/teams-sample-sync/decisions.yml"|".github/teams-sample-sync/proposals/$decision_id.patch"|".github/teams-sample-sync/state/$sample.lock.json") ;;
              *) echo "Pull request contains an unauthorized path: $changed_path" >&2; exit 1 ;;
            esac
          done < <(gh api "repos/${{ github.repository }}/pulls/$pr/files" --paginate --jq '.[].filename')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "actor=$actor" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "proposal_sha=$proposal_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate without executing it
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.guard.outputs.sha }}
          fetch-depth: 2
          path: .sync/candidate

      - name: Independently inspect decision transition
        id: inspect
        env:
          TRUSTED_PROPOSAL_SHA: ${{ steps.guard.outputs.proposal_sha }}
        run: |
          test "$(git -C .sync/candidate rev-parse HEAD^)" = "$TRUSTED_PROPOSAL_SHA"
          node "$SYNC_SKILL/scripts/dist/inspect-decision.js" \
            --repo-root .sync/candidate \
            --base-ref HEAD^ \
            --id "$(jq -r .decisionId .sync/attested/attestation.json)" \
            --outcome "$(jq -r .outcome .sync/attested/attestation.json)" \
            --output .sync/transition-trusted.json
          node <<'JS'
          const fs = require('node:fs');
          const trusted = require('./.sync/transition-trusted.json');
          const attested = require('./.sync/attested/attestation.json');
          for (const key of ['id', 'sample', 'outcome', 'headSha']) {
            const attestedKey = key === 'id' ? 'decisionId' : key;
            if (trusted[key] !== attested[attestedKey]) throw new Error(`Attestation mismatch: ${key}`);
          }
          if (JSON.stringify(trusted.proposal) !== JSON.stringify(attested.proposal)) {
            throw new Error('Proposal metadata mismatch');
          }
          for (const [key, value] of Object.entries({
            id: trusted.id,
            sample: trusted.sample,
            outcome: trusted.outcome,
            upstream: trusted.proposal.upstreamCommit,
          })) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          JS

      - name: Apply resolved decision with trusted tool
        env:
          DECISION_PR: ${{ steps.guard.outputs.pr }}
          DECISION_ID: ${{ steps.inspect.outputs.id }}
          DECISION_OUTCOME: ${{ steps.inspect.outputs.outcome }}
          DECISION_ACTOR: ${{ steps.guard.outputs.actor }}
        run: |
          node "$SYNC_SKILL/scripts/dist/record-decision.js" \
            --file .sync/candidate/.github/teams-sample-sync/decisions.yml \
            --id "$DECISION_ID" \
            --outcome "$DECISION_OUTCOME" \
            --actor "$DECISION_ACTOR" \
            --pull-request "$DECISION_PR"
          node <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const actual = `sha256:${crypto.createHash('sha256').update(fs.readFileSync('.sync/candidate/.github/teams-sample-sync/decisions.yml')).digest('hex')}`;
          const expected = require('./.sync/attested/attestation.json').decisionsFileDigest;
          if (actual !== expected) throw new Error('Resolved decision file does not match the read-only check');
          JS

      - name: Reverse only the exact rejected proposal
        if: steps.inspect.outputs.outcome == 'rejected'
        working-directory: .sync/candidate
        env:
          SYNC_SAMPLE: ${{ steps.inspect.outputs.sample }}
        run: |
          git apply --reverse --index --binary "$(jq -r .proposal.patchPath ../transition-trusted.json)"
          while IFS= read -r changed_path; do
            case "$changed_path" in
              "samples/dotnet/teams/$SYNC_SAMPLE/"*) ;;
              *) echo "Rejected patch staged unauthorized path: $changed_path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)

      - name: Checkout pinned upstream revision
        uses: actions/checkout@v7
        with:
          repository: OfficeDev/Microsoft-Teams-Samples
          ref: ${{ steps.inspect.outputs.upstream }}
          fetch-depth: 1
          path: .sync/upstream-finalize
          persist-credentials: false

      - name: Recompute state with trusted code
        env:
          UPSTREAM_COMMIT: ${{ steps.inspect.outputs.upstream }}
          SYNC_SAMPLE: ${{ steps.inspect.outputs.sample }}
          DECISION_ID: ${{ steps.inspect.outputs.id }}
          DECISION_OUTCOME: ${{ steps.inspect.outputs.outcome }}
        run: |
          node "$SYNC_SKILL/scripts/dist/sync.js" \
            --repo-root .sync/candidate \
            plan \
            --upstream-root .sync/upstream-finalize \
            --upstream-commit "$UPSTREAM_COMMIT" \
            --sample "$SYNC_SAMPLE" \
            --output .sync/final-plan.json
          test "$(jq -r --arg sample "$SYNC_SAMPLE" '.samples[$sample].sourceTree' .sync/final-plan.json)" = "$(jq -r .proposal.sourceTree .sync/transition-trusted.json)"
          node "$SYNC_SKILL/scripts/dist/sync.js" \
            --repo-root .sync/candidate \
            plan \
            --upstream-root .sync/upstream-finalize \
            --upstream-commit "$UPSTREAM_COMMIT" \
            --sample "$SYNC_SAMPLE" \
            --exclude-decision "$DECISION_ID" \
            --output .sync/proposal-input-plan.json
          test "$(jq -r --arg sample "$SYNC_SAMPLE" '.samples[$sample].inputDigest' .sync/proposal-input-plan.json)" = "$(jq -r .proposal.proposalInputDigest .sync/transition-trusted.json)"
          node "$SYNC_SKILL/scripts/dist/sync.js" \
            --repo-root .sync/candidate \
            verify \
            --sample "$SYNC_SAMPLE" \
            --output .sync/final-verification.json
          if [ "$DECISION_OUTCOME" = "approved" ]; then
            expected=$(jq -r .proposal.candidateOutputDigest .sync/transition-trusted.json)
          else
            expected=$(jq -r .proposal.baseOutputDigest .sync/transition-trusted.json)
          fi
          test "$(jq -r .outputDigest .sync/final-verification.json)" = "$expected"
          test "$(jq -r .verifiedOutputDigest .sync/attested/attestation.json)" = "$expected"
          node "$SYNC_SKILL/scripts/dist/sync.js" \
            --repo-root .sync/candidate \
            finalize \
            --sample "$SYNC_SAMPLE" \
            --plan .sync/final-plan.json \
            --first-verification .sync/final-verification.json \
            --second-verification .sync/final-verification.json

      - name: Commit resolved sample and state
        working-directory: .sync/candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.guard.outputs.branch }}
          PR_HEAD_SHA: ${{ steps.guard.outputs.sha }}
          PR_NUMBER: ${{ steps.guard.outputs.pr }}
          SYNC_SAMPLE: ${{ steps.inspect.outputs.sample }}
          DECISION_ID: ${{ steps.inspect.outputs.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "samples/dotnet/teams/$SYNC_SAMPLE" \
            .github/teams-sample-sync/decisions.yml \
            ".github/teams-sample-sync/state/$SYNC_SAMPLE.lock.json"
          git commit -m "Resolve sync decision $DECISION_ID"
          current=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
          test "$(jq -r .state <<< "$current")" = "open"
          test "$(jq -r .draft <<< "$current")" = "true"
          test "$(jq -r .head.sha <<< "$current")" = "$PR_HEAD_SHA"
          test "$(jq -r .head.repo.full_name <<< "$current")" = "${{ github.repository }}"
          test "$(jq -r .head.ref <<< "$current")" = "$PR_BRANCH"
          test "$(jq -r .base.ref <<< "$current")" = "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:$PR_BRANCH"

      - name: Report resolved decision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.guard.outputs.pr }}
          DECISION_ID: ${{ steps.inspect.outputs.id }}
          DECISION_OUTCOME: ${{ steps.inspect.outputs.outcome }}
        run: |
          gh label create decision-resolved --color 0E8A16 --description "Product decision resolved; merge pending" --force
          gh pr edit "$PR_NUMBER" --remove-label decision-required --add-label decision-resolved
          gh pr comment "$PR_NUMBER" --body "Resolved \`$DECISION_ID\` as **$DECISION_OUTCOME**. Targeted validation passed. The pull request remains draft for normal review."
