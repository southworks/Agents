name: Check Teams sample sync decision

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:
    inputs:
      pullRequest:
        description: Sync pull request number
        required: true
        type: string
      actor:
        description: Human who made the decision
        required: true
        type: string
      decisionId:
        description: Expected decision ID
        required: false
        type: string
      outcome:
        description: Expected outcome
        required: false
        type: choice
        options: [approved, rejected]
      commentId:
        description: Originating fallback comment ID
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

env:
  SYNC_SKILL: agent-plugins/agents-for-net/skills/sync-teams-dotnet-samples-to-agents-sdk

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'automation/teams-sample-sync/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve decision event
        id: event
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pullRequest }}
          EVENT_ACTOR: ${{ github.event.sender.login }}
          INPUT_ACTOR: ${{ inputs.actor }}
          EVENT_SHA: ${{ github.event.after }}
          INPUT_COMMENT_ID: ${{ inputs.commentId }}
          EXPECTED_ID: ${{ inputs.decisionId }}
          EXPECTED_OUTCOME: ${{ inputs.outcome }}
          DISPATCH_ACTOR: ${{ github.actor }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pr="$EVENT_PR"
            actor="$EVENT_ACTOR"
          else
            pr="$INPUT_PR"
            actor="$INPUT_ACTOR"
          fi
          [[ "$pr" =~ ^[0-9]+$ ]]
          pr_json=$(gh api "repos/${{ github.repository }}/pulls/$pr")
          pr=$(jq -r .number <<< "$pr_json")
          head_repo=$(jq -r .head.repo.full_name <<< "$pr_json")
          branch=$(jq -r .head.ref <<< "$pr_json")
          sha=$(jq -r .head.sha <<< "$pr_json")
          if [ "$head_repo" != "${{ github.repository }}" ] || [[ "$branch" != automation/teams-sample-sync/* ]]; then
            echo "A same-repository sync branch is required" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$sha" = "$EVENT_SHA"
          elif [ -n "$INPUT_COMMENT_ID" ]; then
            comment=$(gh api "repos/${{ github.repository }}/issues/comments/$INPUT_COMMENT_ID")
            test "$(jq -r .user.login <<< "$comment")" = "$actor"
            test "$(jq -r .issue_url <<< "$comment")" = "${{ github.api_url }}/repos/${{ github.repository }}/issues/$pr"
            case "$EXPECTED_OUTCOME" in approved) command_outcome=approve ;; rejected) command_outcome=reject ;; *) exit 1 ;; esac
            comment_body=$(jq -r .body <<< "$comment")
            if [[ ! "$comment_body" =~ ^/sync-decision[[:space:]]+([A-Z]+-[0-9]+)[[:space:]]+(approve|reject)[[:space:]]*$ ]]; then exit 1; fi
            test "${BASH_REMATCH[1]}" = "$EXPECTED_ID"
            test "${BASH_REMATCH[2]}" = "$command_outcome"
          else
            test "$actor" = "$DISPATCH_ACTOR"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "actor=$actor" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.event.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.SYNC_SKILL }}/scripts/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Install deterministic sync dependencies
        run: |
          npm ci --prefix "$SYNC_SKILL/scripts"
          npm run build --prefix "$SYNC_SKILL/scripts"

      - name: Detect decision status transition
        id: probe
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const path = require('node:path');
          const { parse } = require(path.resolve(process.env.SYNC_SKILL, 'scripts/node_modules/yaml'));
          const relative = '.github/teams-sample-sync/decisions.yml';
          const before = parse(cp.execFileSync('git', ['show', `HEAD^:${relative}`], { encoding: 'utf8' }));
          const after = parse(fs.readFileSync(relative, 'utf8'));
          const prior = new Map(before.decisions.map(item => [item.id, item]));
          const transitions = after.decisions.filter(item =>
            prior.get(item.id)?.status === 'proposed' && ['approved', 'rejected'].includes(item.status));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${transitions.length > 0}\n`);
          JS

      - name: Authorize decision actor
        if: steps.probe.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION_ACTOR: ${{ steps.event.outputs.actor }}
        run: |
          permission=$(gh api "repos/${{ github.repository }}/collaborators/$DECISION_ACTOR/permission" --jq .permission)
          case "$permission" in admin|maintain|write) ;; *) echo "Write permission required" >&2; exit 1 ;; esac

      - name: Mark non-decision synchronization
        if: steps.probe.outputs.value != 'true'
        run: |
          mkdir -p .sync/decision
          echo '{"eligible":false}' > .sync/decision/attestation.json

      - name: Inspect exact status transition
        id: inspect
        if: steps.probe.outputs.value == 'true'
        env:
          EXPECTED_ID: ${{ inputs.decisionId }}
          EXPECTED_OUTCOME: ${{ inputs.outcome }}
          PR_BRANCH: ${{ steps.event.outputs.branch }}
        run: |
          mkdir -p .sync/decision
          args=()
          if [ -n "$EXPECTED_ID" ]; then args+=(--id "$EXPECTED_ID"); fi
          if [ -n "$EXPECTED_OUTCOME" ]; then args+=(--outcome "$EXPECTED_OUTCOME"); fi
          node "$SYNC_SKILL/scripts/dist/inspect-decision.js" \
            --repo-root . \
            --base-ref HEAD^ \
            --output .sync/decision/transition.json \
            "${args[@]}"
          node <<'JS'
          const fs = require('node:fs');
          const value = require('./.sync/decision/transition.json');
          for (const [key, data] of Object.entries({
            id: value.id,
            sample: value.sample,
            outcome: value.outcome,
            upstream: value.proposal.upstreamCommit,
          })) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${data}\n`);
          JS
          branch_sample="$PR_BRANCH"
          branch_sample="${branch_sample##*/}"
          if [ "$branch_sample" != "$(jq -r .sample .sync/decision/transition.json)" ]; then
            echo "Decision sample does not match the sync branch" >&2
            exit 1
          fi

      - name: Record human authority in check workspace
        if: steps.probe.outputs.value == 'true'
        env:
          DECISION_ID: ${{ steps.inspect.outputs.id }}
          DECISION_OUTCOME: ${{ steps.inspect.outputs.outcome }}
          DECISION_ACTOR: ${{ steps.event.outputs.actor }}
          PR_NUMBER: ${{ steps.event.outputs.pr }}
        run: |
          node "$SYNC_SKILL/scripts/dist/record-decision.js" \
            --file .github/teams-sample-sync/decisions.yml \
            --id "$DECISION_ID" \
            --outcome "$DECISION_OUTCOME" \
            --actor "$DECISION_ACTOR" \
            --pull-request "$PR_NUMBER"

      - name: Checkout pinned upstream revision
        if: steps.probe.outputs.value == 'true'
        uses: actions/checkout@v7
        with:
          repository: OfficeDev/Microsoft-Teams-Samples
          ref: ${{ steps.inspect.outputs.upstream }}
          fetch-depth: 1
          path: .sync/upstream
          persist-credentials: false

      - name: Restore rejected candidate to exact base output
        if: steps.probe.outputs.value == 'true' && steps.inspect.outputs.outcome == 'rejected'
        run: git apply --reverse --binary "$(jq -r .proposal.patchPath .sync/decision/transition.json)"

      - name: Recalculate resolved one-sample plan
        if: steps.probe.outputs.value == 'true'
        env:
          UPSTREAM_COMMIT: ${{ steps.inspect.outputs.upstream }}
          SYNC_SAMPLE: ${{ steps.inspect.outputs.sample }}
          DECISION_ID: ${{ steps.inspect.outputs.id }}
        run: |
          node "$SYNC_SKILL/scripts/dist/sync.js" \
            --repo-root . \
            plan \
            --upstream-root .sync/upstream \
            --upstream-commit "$UPSTREAM_COMMIT" \
            --sample "$SYNC_SAMPLE" \
            --output .sync/decision/plan.json
          test "$(jq -r --arg sample "$SYNC_SAMPLE" '.samples[$sample].sourceTree' .sync/decision/plan.json)" = "$(jq -r .proposal.sourceTree .sync/decision/transition.json)"
          node "$SYNC_SKILL/scripts/dist/sync.js" \
            --repo-root . \
            plan \
            --upstream-root .sync/upstream \
            --upstream-commit "$UPSTREAM_COMMIT" \
            --sample "$SYNC_SAMPLE" \
            --exclude-decision "$DECISION_ID" \
            --output .sync/decision/proposal-input-plan.json
          test "$(jq -r --arg sample "$SYNC_SAMPLE" '.samples[$sample].inputDigest' .sync/decision/proposal-input-plan.json)" = "$(jq -r .proposal.proposalInputDigest .sync/decision/transition.json)"

      - name: Restore selected destination sample
        if: steps.probe.outputs.value == 'true'
        env:
          SYNC_SAMPLE: ${{ steps.inspect.outputs.sample }}
        run: dotnet restore "samples/dotnet/teams/$SYNC_SAMPLE"

      - name: Run targeted sample validation
        if: steps.probe.outputs.value == 'true'
        env:
          SYNC_SAMPLE: ${{ steps.inspect.outputs.sample }}
          DECISION_OUTCOME: ${{ steps.inspect.outputs.outcome }}
        run: |
          node "$SYNC_SKILL/scripts/dist/sync.js" \
            --repo-root . \
            verify \
            --sample "$SYNC_SAMPLE" \
            --run-build \
            --no-restore \
            --validate-schema \
            --output .sync/decision/verification.json
          if [ "$DECISION_OUTCOME" = "approved" ]; then
            expected=$(jq -r .proposal.candidateOutputDigest .sync/decision/transition.json)
          else
            expected=$(jq -r .proposal.baseOutputDigest .sync/decision/transition.json)
          fi
          test "$(jq -r .outputDigest .sync/decision/verification.json)" = "$expected"

      - name: Run protected targeted contracts
        if: >-
          steps.probe.outputs.value == 'true' &&
          (steps.inspect.outputs.sample == 'bot-ai-messages' || steps.inspect.outputs.sample == 'bot-cards')
        run: >-
          dotnet test tests/dotnet/teams-sample-sync/TeamsSampleSync.ContractTests.csproj
          --nologo --verbosity minimal

      - name: Prepare verified state and attestation
        if: steps.probe.outputs.value == 'true'
        env:
          DECISION_ACTOR: ${{ steps.event.outputs.actor }}
          PR_NUMBER: ${{ steps.event.outputs.pr }}
          PR_BRANCH: ${{ steps.event.outputs.branch }}
          PR_HEAD_SHA: ${{ steps.event.outputs.sha }}
          SYNC_SAMPLE: ${{ steps.inspect.outputs.sample }}
        run: |
          node "$SYNC_SKILL/scripts/dist/sync.js" \
            --repo-root . \
            finalize \
            --sample "$SYNC_SAMPLE" \
            --plan .sync/decision/plan.json \
            --first-verification .sync/decision/verification.json \
            --second-verification .sync/decision/verification.json \
            --output .sync/decision/final-state.json
          node <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const transition = require('./.sync/decision/transition.json');
          const verification = require('./.sync/decision/verification.json');
          const digest = p => `sha256:${crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')}`;
          const metadata = {
            version: 1,
            eligible: true,
            workflow: 'Check Teams sample sync decision',
            pullRequest: process.env.PR_NUMBER,
            actor: process.env.DECISION_ACTOR,
            branch: process.env.PR_BRANCH,
            headSha: process.env.PR_HEAD_SHA,
            decisionId: transition.id,
            sample: transition.sample,
            outcome: transition.outcome,
            proposal: transition.proposal,
            verifiedOutputDigest: verification.outputDigest,
            decisionsFileDigest: digest('.github/teams-sample-sync/decisions.yml'),
          };
          fs.writeFileSync('.sync/decision/attestation.json', `${JSON.stringify(metadata, null, 2)}\n`);
          fs.copyFileSync('.github/teams-sample-sync/decisions.yml', '.sync/decision/decisions.yml');
          JS

      - name: Upload targeted decision result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teams-sample-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sync/decision
          if-no-files-found: error
          retention-days: 7
