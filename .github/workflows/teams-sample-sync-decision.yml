name: Record Teams sample sync decision

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  decision:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/sync-decision ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Parse command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [[ "$COMMENT_BODY" =~ ^/sync-decision[[:space:]]+(DEC-[0-9]+)[[:space:]]+(approve|reject)[[:space:]]*$ ]]; then
            echo "id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            case "${BASH_REMATCH[2]}" in
              approve) echo "outcome=approved" >> "$GITHUB_OUTPUT" ;;
              reject) echo "outcome=rejected" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "Invalid decision command" >&2
            exit 1
          fi

      - name: Verify maintainer permission and branch
        id: authorization
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          permission=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" --jq .permission)
          case "$permission" in admin|maintain|write) ;; *) echo "Write permission required" >&2; exit 1 ;; esac
          head_repo=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .head.repo.full_name)
          branch=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .head.ref)
          if [ "$head_repo" != "${{ github.repository }}" ] || [[ "$branch" != automation/teams-sample-sync/* ]]; then
            echo "Decision commands require a same-repository sync branch" >&2
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.authorization.outputs.branch }}
          fetch-depth: 2
          path: .sync/candidate

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agent-plugins/agents-for-net/skills/sync-teams-dotnet-samples-to-agents-sdk/scripts/package-lock.json

      - name: Install deterministic sync dependencies
        run: |
          npm ci --prefix agent-plugins/agents-for-net/skills/sync-teams-dotnet-samples-to-agents-sdk/scripts
          npm run build --prefix agent-plugins/agents-for-net/skills/sync-teams-dotnet-samples-to-agents-sdk/scripts

      - name: Apply status-only fallback decision
        id: decision
        env:
          DECISION_ID: ${{ steps.command.outputs.id }}
          OUTCOME: ${{ steps.command.outputs.outcome }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          result=$(node agent-plugins/agents-for-net/skills/sync-teams-dotnet-samples-to-agents-sdk/scripts/dist/record-decision.js \
            --file .sync/candidate/.github/teams-sample-sync/decisions.yml \
            --id "$DECISION_ID" \
            --outcome "$OUTCOME" \
            --actor "$ACTOR" \
            --pull-request "$PR_NUMBER" \
            --status-only)
          sample=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).sample)" "$result")
          echo "sample=$sample" >> "$GITHUB_OUTPUT"

      - name: Commit decision
        working-directory: .sync/candidate
        env:
          DECISION_ID: ${{ steps.command.outputs.id }}
          OUTCOME: ${{ steps.command.outputs.outcome }}
          PR_BRANCH: ${{ steps.authorization.outputs.branch }}
          SYNC_SAMPLE: ${{ steps.decision.outputs.sample }}
        run: |
          test "$PR_BRANCH" = "automation/teams-sample-sync/$SYNC_SAMPLE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/teams-sample-sync/decisions.yml
          git commit -m "Record $OUTCOME sync decision $DECISION_ID"
          git push origin "HEAD:$PR_BRANCH"

      - name: Confirm decision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          DECISION_ID: ${{ steps.command.outputs.id }}
          OUTCOME: ${{ steps.command.outputs.outcome }}
        run: >-
          gh pr comment "$PR_NUMBER"
          --body "Applied **$OUTCOME** for \`$DECISION_ID\`. Targeted validation started."

      - name: Start targeted decision check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          DECISION_ID: ${{ steps.command.outputs.id }}
          OUTCOME: ${{ steps.command.outputs.outcome }}
        run: |
          gh workflow run teams-sample-sync-decision-check.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f pullRequest="$PR_NUMBER" \
            -f actor="${{ github.actor }}" \
            -f decisionId="$DECISION_ID" \
            -f outcome="$OUTCOME" \
            -f commentId="${{ github.event.comment.id }}"
