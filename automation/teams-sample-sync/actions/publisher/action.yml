name: Teams sample sync publish
description: Run the publish phase of internal Teams sample synchronization.
inputs:
  sample:
    description: Selected sample
    required: true
runs:
  using: composite
  steps:
    - id: download
      uses: actions/download-artifact@v7
      continue-on-error: true
      with:
        name: teams-sample-sync-${{ inputs.sample }}
        path: .sync/result
    - id: ready
      name: Select publishable result
      shell: bash
      run: |
        ready=false
        if [ "${{ steps.download.outcome }}" = success ] && [ -f .sync/result/sync-result.json ]; then
          if [ "$(jq -r .publishable .sync/result/sync-result.json)" = true ] && [ "$(jq -r .publicationKind .sync/result/sync-result.json)" != null ]; then
            ready=true
          fi
        fi
        echo "ready=$ready" >> "$GITHUB_OUTPUT"
    - name: Apply and verify validated patch
      if: steps.ready.outputs.ready == 'true'
      shell: bash
      env:
        SYNC_SAMPLE: ${{ inputs.sample }}
      run: |
        git apply --index --binary .sync/result/change.patch
        node "$SYNC_TOOL/dist/cli.js" verify-patch --repo-root . --sample "$SYNC_SAMPLE" --result .sync/result/sync-result.json
    - name: Push draft PR
      if: steps.ready.outputs.ready == 'true'
      shell: bash
      env:
        SYNC_SAMPLE: ${{ inputs.sample }}
      run: |
        branch="automation/teams-sample-sync/$SYNC_SAMPLE"
        kind="$(jq -r .publicationKind .sync/result/sync-result.json)"
        title="Sync Teams SDK sample: $SYNC_SAMPLE"
        commit="Sync Teams SDK sample: $SYNC_SAMPLE"
        if [ "$kind" = report ]; then
          title="Teams SDK sync needs decision: $SYNC_SAMPLE"
          commit="Report Teams SDK sync blocker: $SYNC_SAMPLE"
        fi
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git fetch origin "$branch:refs/remotes/origin/$branch" || true
        git checkout -B "$branch"
        git commit -m "$commit"
        git push --force-with-lease origin "$branch"
        number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
        if [ "$number" = null ]; then
          gh pr create --draft --head "$branch" --title "$title" --body-file .sync/result/pr-body.md
        else
          gh pr edit "$number" --title "$title" --body-file .sync/result/pr-body.md
        fi
